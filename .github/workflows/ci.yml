name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # JS-106 drift test (scripts/tests/test_no_drift.py) calls
          # `git show 03ac4ddc...:<path>` against the JS-106 baseline.
          # The default shallow clone (depth=1) does not include that commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Node.js (current LTS)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint layered rules
        run: make lint-rules

      - name: Lint backlog render
        run: make lint-backlog-render

      - name: go vet
        run: make vet

      - name: Go tests
        run: make test

      - name: Build (server + web)
        run: make build
