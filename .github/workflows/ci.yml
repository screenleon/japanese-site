name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # JS-106 drift test (scripts/tests/test_no_drift.py) calls
          # `git show 03ac4ddc...:<path>` against the JS-106 baseline.
          # The default shallow clone (depth=1) does not include that commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Set up Node.js (current LTS)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Lint layered rules
        run: make lint-rules

      - name: Lint backlog render
        run: make lint-backlog-render

      - name: go vet
        run: make vet

      - name: Go tests
        run: make test

      - name: Build (server + web)
        run: make build
